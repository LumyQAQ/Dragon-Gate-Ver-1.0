name: 🐉 Daily Dragon Gate Update

on:
  schedule:
    # 每天北京时间 16:30 (UTC时间 08:30)，周一到周五执行
    - cron: '30 8 * * 1-5'
  # 添加这个魔法开关，允许我们在网页上手动点击运行！
  workflow_dispatch:

permissions:
  contents: write # 赋予机器人向仓库保存文件的权限

jobs:
  update-data:
    runs-on: ubuntu-latest # 使用最新的 Linux 云服务器

    steps:
    - name: 📥 拉取仓库代码
      uses: actions/checkout@v3

    - name: 🐍 配置 Python 3.10 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 执行全自动流水线 (爬取 -> 策略 -> 抽水)
      run: |
        python update_data.py
        python strategy_engine.py
        python generate_sample_db.py

    - name: 💾 自动上传最新的 CSV 和 DB 到 GitHub
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add rrg_daily_result.csv sample_data.db
        # 如果有新数据就提交，没有变化就跳过
        git commit -m "🤖 每日盘后自动更新: $(date +'%Y-%m-%d')" || echo "今日数据无变化"
        git push
